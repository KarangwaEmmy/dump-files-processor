version: '3.8'
services:
  dump_listener:
    build: .
    container_name: dump_listener
    volumes:
      # Host Dump directory (set HOST_DUMP_DIR env var to override), default: ./Dump
      - ${HOST_DUMP_DIR:-./Dump}:/app/Dump
      - ${HOST_LOGS_DIR:-./logs}:/app/logs
    environment:
      - DUMP_DIR=/app/Dump
      - API_LOGIN_URL=${API_LOGIN_URL}
      - API_URL=${API_URL}
      - API_EMAIL=${API_EMAIL}
      - API_PASSWORD=${API_PASSWORD}
      - API_TIMEOUT=${API_TIMEOUT}
    restart: always
